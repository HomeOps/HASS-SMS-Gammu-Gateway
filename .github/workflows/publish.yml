name: Publish add-on images

on:
  # Called by release-please after it creates a release. A tag push cannot be
  # used as the trigger: release-please pushes with GITHUB_TOKEN, and GitHub
  # does not start workflows from events created by that token.
  workflow_call:
    inputs:
      version:
        description: "Version to tag the images with"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag the images with (e.g. 1.8.1). Defaults to config.json."
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, amd64, armhf, armv7, i386]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version=$(python3 -c "import json; print(json.load(open('sms-gammu-gateway/config.json'))['version'])")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The official builder cross-builds with QEMU and applies the add-on
      # labelling Supervisor expects.
      - name: Build and push
        uses: home-assistant/builder@2024.03.5
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/sms-gammu-gateway \
            --image hass-sms-gammu-gateway-{arch} \
            --docker-hub ghcr.io/homeops \
            --version ${{ steps.meta.outputs.version }} \
            --addon
