name: Publish add-on images

on:
  # Called by release-please after it creates a release. A tag push cannot be
  # used as the trigger: release-please pushes with GITHUB_TOKEN, and GitHub
  # does not start workflows from events created by that token.
  workflow_call:
    inputs:
      version:
        description: "Version to tag the images with"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag the images with (e.g. 1.8.1). Defaults to config.json."
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.arch }}
    # Each architecture builds on its own hardware. Cross-building under QEMU
    # segfaults gcc and collect2 partway through the libGammu compile, and it is
    # nondeterministic, so retrying does not help.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
            base: ghcr.io/home-assistant/aarch64-base:3.19
          - arch: amd64
            runner: ubuntu-latest
            base: ghcr.io/home-assistant/amd64-base:3.19
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version=$(python3 -c "import json; print(json.load(open('sms-gammu-gateway/config.json'))['version'])")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built directly rather than through home-assistant/builder, which always
      # cross-builds with QEMU. The labels Supervisor reads are applied here.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: sms-gammu-gateway
          build-args: BUILD_FROM=${{ matrix.base }}
          push: true
          tags: |
            ghcr.io/homeops/hass-sms-gammu-gateway-${{ matrix.arch }}:${{ steps.meta.outputs.version }}
            ghcr.io/homeops/hass-sms-gammu-gateway-${{ matrix.arch }}:latest
          labels: |
            io.hass.version=${{ steps.meta.outputs.version }}
            io.hass.arch=${{ matrix.arch }}
            io.hass.type=addon
            io.hass.name=SMS Gammu Gateway (HomeOps)
            org.opencontainers.image.source=https://github.com/HomeOps/HASS-SMS-Gammu-Gateway
            org.opencontainers.image.licenses=GPL-2.0-or-later
