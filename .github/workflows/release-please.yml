name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs['sms-gammu-gateway--release_created'] }}
      version: ${{ steps.release.outputs['sms-gammu-gateway--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Images are published from here rather than from a tag push: release-please
  # tags with GITHUB_TOKEN, and GitHub does not start workflows from events
  # created by that token, so `on: push: tags:` would never fire.
  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
    permissions:
      contents: read
      packages: write
