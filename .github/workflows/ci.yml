name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # python-gammu compiles against libgammu, and the integration tests drive
      # gammu's dummy driver, so the headers are needed even without a modem.
      - name: Install libgammu
        run: sudo apt-get update && sudo apt-get install -y libgammu-dev pkg-config
      - name: Install dependencies
        run: pip install -r sms-gammu-gateway/requirements-dev.txt
      - name: Run tests
        run: pytest

  build:
    name: Build add-on (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Smoke test only. The image compiles libGammu from source, so building
      # every architecture on each pull request is not worth the wall clock.
      - name: Build image
        run: |
          docker build \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.19 \
            -t sms-gammu-gateway:ci \
            sms-gammu-gateway
      - name: Verify python-gammu links the patched libGammu
        run: |
          docker run --rm sms-gammu-gateway:ci \
            python3 -c "import gammu; print(gammu.Version())"

      # End to end against a fake modem on a pseudo terminal. Everything the image
      # ships is in the loop: its libGammu, python-gammu linked against it,
      # support.py, the Flask API and the send path. The base image entrypoint is
      # s6, so it is overridden to run the harness directly.
      - name: 'E2E: standard prompt sends'
        run: |
          docker run --rm --entrypoint python3 \
            -v "${{ github.workspace }}/sms-gammu-gateway/tests/e2e:/e2e:ro" \
            sms-gammu-gateway:ci /e2e/send_sms_e2e.py --prompt padded --expect sent

      # The regression that matters. A stock libGammu fails this with TIMEOUT[14];
      # only a build carrying gammu/gammu#1177 sends. If the Dockerfile's patch step
      # ever silently stops applying, this is what catches it.
      - name: 'E2E: bare prompt sends (proves the libGammu patch is in the image)'
        run: |
          docker run --rm --entrypoint python3 \
            -v "${{ github.workspace }}/sms-gammu-gateway/tests/e2e:/e2e:ro" \
            sms-gammu-gateway:ci /e2e/send_sms_e2e.py --prompt bare --expect sent

      # A prompt that is corrupt rather than merely unpadded must still be rejected:
      # the patch widens what counts as a prompt, and this pins how far.
      - name: 'E2E: corrupt prompt fails without sending'
        run: |
          docker run --rm --entrypoint python3 \
            -v "${{ github.workspace }}/sms-gammu-gateway/tests/e2e:/e2e:ro" \
            sms-gammu-gateway:ci /e2e/send_sms_e2e.py --prompt garbage --expect failed

      - name: 'E2E: silent modem fails without sending'
        run: |
          docker run --rm --entrypoint python3 \
            -v "${{ github.workspace }}/sms-gammu-gateway/tests/e2e:/e2e:ro" \
            sms-gammu-gateway:ci /e2e/send_sms_e2e.py --prompt silent --expect failed

      # The user visible question behind the worker change: after a bad stretch,
      # does the gateway come back on its own, or stay degraded until restarted?
      - name: 'E2E: recovers in place once the modem behaves'
        run: |
          docker run --rm --entrypoint python3 \
            -v "${{ github.workspace }}/sms-gammu-gateway/tests/e2e:/e2e:ro" \
            sms-gammu-gateway:ci /e2e/send_sms_e2e.py --prompt garbage --scenario recovery --monitoring

      # One thread owns the state machine, so concurrent callers queue instead of
      # reaching the port together. The modem counts interleaving directly: a PDU
      # cannot contain "AT".
      - name: 'E2E: concurrent callers never interleave on the port'
        run: |
          docker run --rm --entrypoint python3 \
            -v "${{ github.workspace }}/sms-gammu-gateway/tests/e2e:/e2e:ro" \
            -e GAMMU_COMMAND_TIMEOUT=10 -e GAMMU_STALL_LIMIT=0 \
            sms-gammu-gateway:ci /e2e/send_sms_e2e.py --prompt silent --scenario concurrent

      # A modem that never answers cannot be recovered from inside the process:
      # even the soft reset queues behind a call that cannot be interrupted. The
      # timeouts are shortened so the give-up path is reached in seconds.
      - name: 'E2E: a modem that never answers restarts the add-on'
        run: |
          docker run --rm --entrypoint python3 \
            -v "${{ github.workspace }}/sms-gammu-gateway/tests/e2e:/e2e:ro" \
            -e GAMMU_COMMAND_TIMEOUT=5 -e GAMMU_STALL_LIMIT=3 \
            sms-gammu-gateway:ci /e2e/send_sms_e2e.py --prompt silent --scenario watchdog
